<section class="row h-100">
    <div class="animate__animated animate__fadeInLeftBig col-lg-6 col-md-12 sf-bg-dark sf-cl-row">
        <h1 class="sf-text-white text-center">Cómo nos preparamos para una emergencia…</h1>
        <img src="../../assets/img/avatars/avatar_mujer_mirando_de frente_con_cuaderno_fondo_azul.webp" alt="avatar"
            class="sf-img-80 sf-img-sm-60 sf-img-md-40 sf-img-lg-30 sf-img-xl-40 mx-auto">
        <h1><span class="sf-text-purple">Procedimiento de rescate:</span>
        </h1>
    </div>
    <div class="animate__animated animate__fadeInRightBig col-lg-6 col-md-12 sf-cr-row">
        <i class="hipt hipt-light mb-3">
            Haz clic sobre los botones para escuchar su respectiva definición audio
            <i class="icon-inline icon-inline--start fa-solid fa-arrow-turn-down ms-2"></i>
        </i>

        <!-- Actividad de selección -->
        <div
            class="animate__animated animate__zoomIn animate__delay-1s bg-white  rounded-lg shadow-md w-full max-w-2xl mx-auto">
            <div class="image-sld22emergencia" id="imageContainer_sld22emergencia">
                <img src="./momento3_7/img/procedimiento_rescate_sldM1.webp" alt="Matriz de riesgos"
                    id="mainImage_sld22emergencia">
                <button class="circle-button_sld22emergencia" id="button1_sld22emergencia"
                    data-audio="./momento3_7/audio/uno-m2-slide-22.mp3" data-transcripcion='[
                                                    {"start":0,"end":1,"text":"Asegurar el área:"},
                                                    {"start":2,"end":5,"text":"Demarcar el espacio para evitar interferencias."}
                                                    ]'
                    onclick="showAudioWithTranscription_sld22emergencia(this, '<strong>Asegurar el área:</strong><br>Demarcar el espacio para evitar interferencias.', event)">
                    1</button>
                <button class="circle-button_sld22emergencia" id="button2_sld22emergencia"
                    data-audio="./momento3_7/audio/dos-m2-slide-22.mp3" data-transcripcion='[
                                                    {"start":0,"end":2,"text":"Evaluación y planificación:"},
                                                    {"start":2,"end":6,"text":"Decidir el equipo y el método de rescate."}
                                                    ]'
                    onclick="showAudioWithTranscription_sld22emergencia(this, '<strong>Evaluación y planificación:</strong><br>Decidir el equipo y el método de rescate.', event)">
                    2</button>
                <button class="circle-button_sld22emergencia" id="button3_sld22emergencia"
                    data-audio="./momento3_7/audio/tres-m2-slide-22.mp3" data-transcripcion='[
                                                    {"start":0,"end":2,"text":"Acceso al accidentado:"},
                                                    {"start":2,"end":4,"text":"Lograr un acceso seguro."}
                                                    ]'
                    onclick="showAudioWithTranscription_sld22emergencia(this, '<strong>Acceso al accidentado:</strong><br>Lograr un acceso seguro.', event)">
                    3</button>
                <button class="circle-button_sld22emergencia" id="button4_sld22emergencia"
                    data-audio="./momento3_7/audio/cuatro-m2-slide-22.mp3" data-transcripcion='[
                                                    {"start":0,"end":2,"text":"Rescate y estabilización:"},
                                                    {"start":2,"end":7,"text":"Ejecutar la maniobra de rescate y estabilizar al accidentado."}
                                                    ]'
                    onclick="showAudioWithTranscription_sld22emergencia(this, '<strong>Rescate y estabilización:</strong><br>Ejecutar la maniobra de rescate y estabilizar al accidentado.', event)">
                    4</button>
                <button class="circle-button_sld22emergencia" id="button5_sld22emergencia"
                    data-audio="./momento3_7/audio/cinco-m2-slide-22.mp3" data-transcripcion='[
                                                    {"start":0,"end":1,"text":"Evacuación de la maniobra:"},
                                                    {"start":2,"end":5,"text":"Evaluar posibles errores o fallas post-rescate."}
                                                    ]'
                    onclick="showAudioWithTranscription_sld22emergencia(this, '<strong>Evacuación de la maniobra:</strong><br>Evaluar posibles errores o fallas post-rescate.', event)">
                    5</button>
                <button class="circle-button_sld22emergencia" id="button6_sld22emergencia"
                    data-audio="./momento3_7/audio/seis-m2-slide-22.mp3" data-transcripcion='[
                                                    {"start":0,"end":3,"text":"Verificación de condición del rescatista:"},
                                                    {"start":3,"end":7,"text":"Asegurar que los rescatistas estén en condiciones óptimas."}
                                                    ]'
                    onclick="showAudioWithTranscription_sld22emergencia(this, '<strong>Verificación de condición del rescatista:</strong><br>Asegurar que los rescatistas estén en condiciones óptimas.', event)">
                    6</button>
            </div>

        </div>
    </div>
</section>
